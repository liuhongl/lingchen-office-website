      - generic [ref=f18e258]:
        - article [ref=f18e259]:
          - text: 路径一·第一步
          - heading "业务场景梳理" [level=3] [ref=f18e260]
          - paragraph [ref=f18e261]: 用2-4周 POC 快速证明价值。通过真实样本定义验收指标，梳理现有获客难点。
        - article [ref=f18e262]:
          - text: 路径一·第二步
          - heading "构建ICP模型并试点" [level=3] [ref=f18e263]
          - paragraph [ref=f18e264]: 基于现有成功客群数据，提炼并配置结构化 ICP 建模与过滤规则，进行小范围高敏开发。
        - article [ref=f18e265]:
          - text: 路径二·第一步
          - heading "系统集成与配置" [level=3] [ref=f18e266]
          - paragraph [ref=f18e267]: 通过验证后，将获客 Harness 接入 CRM 系统、企业邮箱及 LinkedIn，配置人工确认与安全审核边界。
        - article [ref=f18e268]:
          - text: 路径二·第二步
          - heading "规模化运营与进化" [level=3] [ref=f18e269]
          - paragraph [ref=f18e270]: 正式上线测试并进入常态化运作，持续积累用户行为反馈并回写评分模型、开发话术。
      - article [ref=f18e271]:
        - heading "落地建议与指引：为什么选择灵宸 Sales in？" [level=3] [ref=f18e272]
        - paragraph [ref=f18e273]: 1. 结果导向：聚焦可衡量的销售结果，交付高质量线索池与商机增量，而非又一个数据工具。
        - paragraph [ref=f18e274]: 2. 合规安全：尊重各地数据与触达合规，全程可追溯、可复核，守护出海品牌长期声誉。
        - paragraph [ref=f18e275]: 3. 全链路闭环：ICP、线索、洞察、触达、CRM 回写一体，从找客户到成交持续沉淀客户资产。让每一次出海客户连接，都高效、合规地转化为可持续增长。
